<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List - StoryLens</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon"><i data-lucide="film"></i></span>
            <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="favorites.html" class="nav-link active">My List</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
            </ul>
        </nav>
        <div class="actions">
            <div class="user-menu">
                <div id="user-avatar" class="user-avatar"></div>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="login.html" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="page-header" style="text-align: left; padding: 40px 5% 20px;">
        <h1 style="font-size: 32px; text-transform: uppercase;">Your Personal Collection</h1>
        <p style="color: var(--text-secondary); margin-top: 8px;">2 saved films</p>
    </div>

    <div class="movie-grid">
        <div class="movie-grid-card">
            <img src="https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?q=80&w=400&auto=format&fit=crop" alt="Poster">
            <div class="movie-grid-info">
                <div class="movie-grid-title">Vintage Lens</div>
                <div class="movie-grid-meta">
                    <span>Drama, Romance</span>
                    <span><i data-lucide="heart" style="width: 14px; height:14px; color: #ff4b4b; display: inline-block; vertical-align: text-bottom; fill: #ff4b4b;"></i></span>
                </div>
            </div>
        </div>
        <div class="movie-grid-card">
            <img src="https://images.unsplash.com/photo-1585951237318-9ea5e175b891?q=80&w=400&auto=format&fit=crop" alt="Poster">
            <div class="movie-grid-info">
                <div class="movie-grid-title">The Director's Chair</div>
                <div class="movie-grid-meta">
                    <span>Documentary</span>
                    <span><i data-lucide="heart" style="width: 14px; height:14px; color: #ff4b4b; display: inline-block; vertical-align: text-bottom; fill: #ff4b4b;"></i></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-brand">
            <div class="logo">
                <span class="logo-icon"><i data-lucide="film"></i></span>
                <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
            </div>
            <p>Your ultimate cinematic discovery companion. Find your next obsession.</p>
            <br>
            <p>&copy; 2024 StoryLens. All rights reserved.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
    <script src="js/home.js"></script>
</body>
</html>
