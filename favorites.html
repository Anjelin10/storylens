<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List - StoryLens</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon"><i data-lucide="film"></i></span>
            <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>

                <li><a href="about.html" class="nav-link">About</a></li>
            </ul>
        </nav>
        <div class="actions">
            <div class="user-menu">
                <div id="user-avatar" class="user-avatar"></div>

                    <a href="login.html" id="logout-btn">Logout</a>
                </div>

    <div class="page-header" style="text-align: left; padding: 40px 5% 20px;">

        <p style="color: var(--text-secondary); margin-top: 8px;" id="fav-count">0 saved films</p>

    <div class="movie-grid" id="favorites-grid">

                <span class="logo-icon"><i data-lucide="film"></i></span>

        lucide.createIcons();
