<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryLens</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon"><i data-lucide="film"></i></span>
            <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html" class="nav-link active">Home</a></li>
                <li><a href="favorites.html" class="nav-link">My List</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
            </ul>
        </nav>
        <div class="actions">
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i data-lucide="menu"></i></button>
            <div class="user-menu">
                <div id="user-avatar" class="user-avatar"></div>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="login.html" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content" id="hero-content">
        </div>
    </section>

    <!-- Trending Movies Section -->
    <section class="movie-section">
        <div class="section-header">
            <i data-lucide="pictureInPicture2"></i>
            <h2>Trending</h2>
            <p class="view-all"><a href="movies.html?type=trending">View All</a></p>
        </div>
        <div class="movie-row" id="trending-movies">
            <!-- Movie cards will be dynamically inserted here -->
        </div>
    </section>

    <!-- Popular Movies Section -->
    <section class="movie-section">
        <div class="section-header">
            <i data-lucide="trending-up"></i>
            <h2>Popular Movies</h2>
            <p class="view-all"><a href="movies.html?type=popular">View All</a></p>
        </div>
        <div class="movie-row" id="popular-movies">
            <!-- Movie cards will be dynamically inserted here -->
        </div>
    </section>

    <!-- Top Rated Section -->
    <section class="movie-section">
        <div class="section-header">
            <i data-lucide="star"></i>
            <h2>Top Rated Movies</h2>
            <p class="view-all"><a href="movies.html?type=top_rated">View All</a></p>
        </div>
        <div class="movie-row" id="top-rated-movies">
            <!-- Movie cards will be dynamically inserted here -->
        </div>
    </section>

    <!-- Upcoming Section -->
    <section class="movie-section">
        <div class="section-header">
            <i data-lucide="calendar"></i>
            <h2>Upcoming Movies</h2>
            <p class="view-all"><a href="movies.html?type=upcoming">View All</a></p>
        </div>
        <div class="movie-row" id="upcoming-movies">
            <!-- Movie cards will be dynamically inserted here -->
        </div>
    </section>

    <!-- Now Playing Section -->
    <section class="movie-section">
        <div class="section-header">
            <i data-lucide="play"></i>
            <h2>Now Playing</h2>
            <p class="view-all"><a href="movies.html?type=now_playing">View All</a></p>
        </div>
        <div class="movie-row" id="now-playing-movies">
            <!-- Movie cards will be dynamically inserted here -->
        </div>
    </section>
    <footer class="footer">
        <div class="footer-brand">
            <div class="logo">
                <span class="logo-icon"><i data-lucide="film"></i></span>
                <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
            </div>
            <p>Your ultimate cinematic discovery companion. Find your next obsession.</p>
            <br>
            <p>&copy; 2023 StoryLens. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="js/home.js"></script>
</body>
</html>
