<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Discover - StoryLens</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon"><i data-lucide="film"></i></span>
            <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="favorites.html" class="nav-link">My List</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
            </ul>
        </nav>
        <div class="actions">
            <div class="user-menu">
                <div id="user-avatar" class="user-avatar"></div>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="login.html" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="search-container">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" class="search-input" placeholder="Search for movies, actors, or genres...">
        </div>
        <div class="filters-row">
            <a class="filter-pill" data-filter="popular" href="movies.html?type=popular">Popular</a>
            <a class="filter-pill" data-filter="top-rated" href="movies.html?type=top-rated">Top Rated</a>
            <a class="filter-pill" data-filter="upcoming" href="movies.html?type=upcoming">Upcoming</a>
            <a class="filter-pill" data-filter="trending" href="movies.html?type=trending">Trending</a>
        </div>
    </div>

    <div class="movie-grid" id="movie-container">
        <!-- Movie cards will be dynamically inserted here --> 
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-brand">
            <div class="logo">
                <span class="logo-icon"><i data-lucide="film"></i></span>
                <span class="brand-white">STORY</span><span class="brand-gold">LENS</span>
            </div>
            <p>Your ultimate cinematic discovery companion. Find your next obsession.</p>
            <br>
            <p>&copy; 2023 StoryLens. All rights reserved.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/movie.js"></script>
</body>
</html>
