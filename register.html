<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <div>
        <h2>Create Your StoryLens Account</h2>
        <p>Join thousands of movie lovers and start building your personalized movie collection.</p>
        <form>
            <p>Full Name</p>
            <input type="text" placeholder="abc"/>
            <p>Email Address</p>
            <input type="email" placeholder="abc@gmail.com"/>
            <p>Phone Number</p>
            <input type="tel" placeholder="987568****"/>
            <p>Password</p>
            <input type="password" placeholder="******"/>
            <p>Confirm Password</p>
            <input type="password" placeholder="******"/>
            <br/>
            <input type="checkbox"><span>I agree to the Terms & Privacy Policy</span>
        </form>
    </div>
</body>
</html>
